[server]
host = "0.0.0.0"
port = 47120
max_concurrent_requests = 128

[paths]
source_dump_sql = "sql/database/tbcmangos.sql"
sqlite3_exe = "sql/tools/sqlite3.exe"
runtime_db = "data/world.db"
work_dir = "data/work"

[limits]
max_radius = 5000.0
max_limit = 500

[importer]
schema_version = 1
enable_rtree = false
sqlite_import_timeout_secs = 900
