title: SentinelNavClient
description: Navmesh pathfinding and path-following navigation for WoW
url: ""
baseurl: "/scripts"

remote_theme: just-the-docs/just-the-docs

color_scheme: dark

permalink: pretty

aux_links:
  "GitHub":
    - "https://github.com/TheSentinelCore/TheSentinelCore"

nav_sort: order

heading_anchors: true

# Exclude internal planning docs from the site build
exclude:
  - plans/
  - "*.bak"

# Back to top link
back_to_top: true
back_to_top_text: "Back to top"

# Footer
footer_content: "SentinelNavClient &mdash; Navmesh navigation for Sylvannas"

# Search
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
  tokenizer_separator: /[\s/]+/
  rel_url: true
  button: false

# Callouts
callouts:
  note:
    title: Note
    color: blue
  warning:
    title: Warning
    color: red
  tip:
    title: Tip
    color: green
  important:
    title: Important
    color: yellow
