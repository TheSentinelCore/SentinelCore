schemaVersion: "2.0"
profile:
  id: "test_profile"
  name: "Test Profile"
  author: "Sentinel"
  expansion: "TBC"
  faction: "Alliance"
  race: ["Human"]
  class: ["*"]
  levelRange:
    min: 1
    max: 5

variables:
  playerLevel:
    type: "number"
    bind: "player.level"
  bagSlotsFree:
    type: "number"
    bind: "inventory.freeSlots"
  activeQuest:
    type: "number"
    init: null
  phase:
    type: "string"
    init: "start"

states:
  Questing:
    type: "exclusive"
    initial: "Initialize"
    states:
      Initialize:
        type: "atomic"
        onEnter:
          - "coreActions.core.log('Test profile starting')"
        transitions:
          - event: "ProfileStart"
            target: "AcceptQuest"

      AcceptQuest:
        type: "atomic"
        onEnter:
          - "coreActions.nav.followPolicy('test_travel')"
          - "profile.activeQuest = 783"
        transitions:
          - event: "QuestAccepted"
            guard: "event.questId == 783"
            target: "TravelToMobs"
            actions:
              - "profile.phase = 'killing'"

      TravelToMobs:
        type: "atomic"
        onEnter:
          - "coreActions.nav.followPolicy('test_travel')"
        transitions:
          - event: "NavigationArrived"
            guard: "event.policy == 'test_travel'"
            target: "KillMobs"

      KillMobs:
        type: "atomic"
        meta:
          objectiveGroup: "Test Mobs"
          objectiveType: "kill"
          questIds: [783]
          npcIds: [80, 257]
        onEnter:
          - "coreActions.combat.setTargetFilter({80, 257})"
        transitions:
          - event: "ObjectiveProgress"
            guard: "event.questId == 783 and event.current >= 8"
            target: "TurnInQuest"
        onExit:
          - "coreActions.combat.clearTargetFilter()"

      TurnInQuest:
        type: "atomic"
        onEnter:
          - "coreActions.nav.followPolicy('test_return')"
        transitions:
          - event: "NavigationArrived"
            guard: "event.policy == 'test_return'"
            target: "Finished"
            actions:
              - "coreActions.quest.turnInQuest(783)"

      Finished:
        type: "final"
        onEnter:
          - "coreActions.core.log('Test profile complete')"

  Survival:
    type: "parallel"
    initial: "HealthManagement"
    regions:
      HealthManagement:
        type: "exclusive"
        initial: "Healthy"
        states:
          Healthy:
            type: "atomic"
            transitions:
              - event: "HealthChanged"
                guard: "event.pct < 40"
                target: "Eating"
          Eating:
            type: "atomic"
            onEnter:
              - "coreActions.consume.useFood()"
            transitions:
              - event: "HealthChanged"
                guard: "event.pct >= 85"
                target: "Healthy"
            onExit:
              - "coreActions.consume.stop()"

  Logistics:
    type: "parallel"
    initial: "Inventory"
    regions:
      Inventory:
        type: "exclusive"
        initial: "Normal"
        states:
          Normal:
            type: "atomic"
            transitions:
              - event: "InventoryChanged"
                guard: "event.freeSlots <= 4"
                target: "Vending"
          Vending:
            type: "atomic"
            onEnter:
              - "coreActions.nav.followPolicy('to_vendor')"
            transitions:
              - event: "NavigationArrived"
                target: "Selling"
              - event: "InventoryChanged"
                guard: "event.freeSlots > 10"
                target: "Normal"
          Selling:
            type: "atomic"
            onEnter:
              - "coreActions.vendor.sellJunk()"
            transitions:
              - event: "VendorDone"
                target: "Normal"

actions: {}