schemaVersion: "2.0"
profile:
  id: "alliance_human_01_10_elwynn"
  name: "Human 1-10 Elwynn Forest"
  author: "Sentinel"
  expansion: "TBC"
  faction: "Alliance"
  race: ["Human"]
  class: ["*"]
  levelRange: {min: 1, max: 10}

variables:
  playerLevel: {type: "number", bind: "player.level"}
  bagSlotsFree: {type: "number", bind: "inventory.freeSlots"}
  durabilityPct: {type: "number", bind: "equipment.lowestDurabilityPct"}
  activeQuest: {type: "number", init: null}
  phase: {type: "string", init: "northshire"}
  hearthstoneBound: {type: "boolean", init: false}

states:
  Questing:
    type: "exclusive"
    initial: "Initialize"
    states:
      Initialize:
        type: "atomic"
        onEnter: ["coreActions.core.log('Profile starting: Human 1-10 Elwynn Forest')"]
        transitions:
          - event: "ProfileStart"
            target: "AcceptNorthshireQuests"

      AcceptNorthshireQuests:
        type: "atomic"
        onEnter:
          - "coreActions.quest.acceptAllQuestsAtNpc(197)"  -- Marshal McBride
          - "profile.activeQuest = 783"
        transitions:
          - event: "QuestAccepted"
            guard: "event.questId == 783"
            target: "TravelToKoboldCamp"
            actions: ["profile.phase = 'kobolds'"]

      TravelToKoboldCamp:
        type: "atomic"
        onEnter:
          - "coreActions.nav.followPolicy('northshire_to_kobolds')"
        transitions:
          - event: "NavigationArrived"
            guard: "event.policy == 'northshire_to_kobolds'"
            target: "KillKobolds"

      KillKobolds:
        type: "atomic"
        meta:
          objectiveGroup: "Northshire Kobolds"
          objectiveType: "kill"
          questIds: [783]
          npcIds: [80, 257]
        onEnter:
          - "coreActions.combat.setTargetFilter({80, 257})"
        transitions:
          - event: "ObjectiveProgress"
            guard: "event.questId == 783 and event.current >= 10"
            target: "TurnInKoboldCleanup"
        onExit:
          - "coreActions.combat.clearTargetFilter()"

      TurnInKoboldCleanup:
        type: "atomic"
        onEnter:
          - "coreActions.nav.followPolicy('kobolds_to_northshire')"
        transitions:
          - event: "NavigationArrived"
            guard: "event.policy == 'kobolds_to_northshire'"
            target: "AcceptNextNorthshire"
            actions: ["coreActions.quest.turnInQuest(783)"]

      AcceptNextNorthshire:
        type: "atomic"
        onEnter:
          - "coreActions.quest.acceptAllQuestsAtNpc(197)"
        transitions:
          - event: "QuestAccepted"
            guard: "event.questId == 7 or event.questId == 15 or event.questId == 3104"
            target: "TravelToGoldshire"

      TravelToGoldshire:
        type: "atomic"
        onEnter:
          - "coreActions.nav.followPolicy('northshire_to_goldshire')"
        transitions:
          - event: "NavigationArrived"
            guard: "event.policy == 'northshire_to_goldshire'"
            target: "GoldshireHub"

      GoldshireHub:
        type: "compound"
        meta:
          objectiveGroup: "Goldshire Hub"
        initial: "AcceptGoldshireQuests"
        states:
          AcceptGoldshireQuests:
            type: "atomic"
            onEnter:
              - "coreActions.quest.acceptAllQuestsAtNpc(295)"  -- Remy "Two Times"
              - "coreActions.quest.acceptAllQuestsAtNpc(296)"  -- Marshal Dughan
              - "coreActions.quest.acceptAllQuestsAtNpc(297)"  -- William Pestle
              - "coreActions.quest.acceptAllQuestsAtNpc(298)"  -- Auntie Bernice
              - "coreActions.quest.acceptAllQuestsAtNpc(299)"  -- Smith Argus
            transitions:
- event: "QuestAccepted"
            guard: "event.questId == 54 or event.questId == 87 or event.questId == 91 or event.questId == 2158 or event.questId == 47"
            target: "GoldshireObjectives"

          GoldshireObjectives:
            type: "exclusive"
            initial: "KillKoboldsGoldshire"
            states:
              KillKoboldsGoldshire:
                type: "atomic"
                meta:
                  objectiveGroup: "Goldshire Kobolds"
                  objectiveType: "kill"
                  questIds: [54]
                  npcIds: [474]
                onEnter:
                  - "coreActions.combat.setTargetFilter({474})"
                  - "coreActions.nav.followPolicy('goldshire_kobold_camp')"
                transitions:
                  - event: "ObjectiveProgress"
                    guard: "event.questId == 54 and event.current >= 10"
                    target: "CollectApples"
                onExit:
                  - "coreActions.combat.clearTargetFilter()"

              CollectApples:
                type: "atomic"
                meta:
                  objectiveGroup: "Goldshire Apples"
                  objectiveType: "collect"
                  questIds: [87]
                  itemId: 1930
                transitions:
                  - event: "ObjectiveProgress"
                    guard: "event.questId == 87 and event.current >= 4"
                    target: "KillMurlocs"

              KillMurlocs:
                type: "atomic"
                meta:
                  objectiveGroup: "Goldshire Murlocs"
                  objectiveType: "kill"
                  questIds: [91]
                  npcIds: [482, 483]
                onEnter:
                  - "coreActions.combat.setTargetFilter({482, 483})"
                  - "coreActions.nav.followPolicy('goldshire_murloc_coast')"
                transitions:
                  - event: "ObjectiveProgress"
                    guard: "event.questId == 91 and event.current >= 8"
                    target: "TurnInGoldshire"
                onExit:
                  - "coreActions.combat.clearTargetFilter()"

              TurnInGoldshire:
                type: "atomic"
                onEnter:
                  - "coreActions.nav.followPolicy('goldshire_to_town')"
                transitions:
                  - event: "NavigationArrived"
                    guard: "event.policy == 'goldshire_to_town'"
                    target: "TravelToEastvale"
                    actions:
                      - "coreActions.quest.turnInQuest(54)"
                      - "coreActions.quest.turnInQuest(87)"
                      - "coreActions.quest.turnInQuest(91)"

          TravelToEastvale:
            type: "atomic"
            onEnter:
              - "coreActions.nav.followPolicy('goldshire_to_eastvale')"
            transitions:
              - event: "NavigationArrived"
                guard: "event.policy == 'goldshire_to_eastvale'"
                target: "EastvaleObjectives"

          EastvaleObjectives:
            type: "compound"
            meta:
              objectiveGroup: "Eastvale Logging Camp"
            initial: "AcceptEastvaleQuests"
            states:
              AcceptEastvaleQuests:
                type: "atomic"
                onEnter:
                  - "coreActions.quest.acceptAllQuestsAtNpc(295)"  -- Guard Thomas
                transitions:
- event: "QuestAccepted"
            guard: "event.questId == 47 or event.questId == 52"
            target: "EastvaleKilling"

              EastvaleKilling:
                type: "exclusive"
                initial: "KillGnolls"
                states:
                  KillGnolls:
                    type: "atomic"
                    meta:
                      objectiveGroup: "Eastvale Gnolls"
                      objectiveType: "kill"
                      questIds: [47]
                      npcIds: [482, 483]  -- Riverpaw Gnolls
                    onEnter:
                      - "coreActions.combat.setTargetFilter({482, 483})"
                      - "coreActions.nav.followPolicy('eastvale_gnoll_camp')"
                    transitions:
                      - event: "ObjectiveProgress"
                        guard: "event.questId == 47 and event.current >= 8"
                        target: "KillOutrunners"
                    onExit:
                      - "coreActions.combat.clearTargetFilter()"

                  KillOutrunners:
                    type: "atomic"
                    meta:
                      objectiveGroup: "Eastvale Outrunners"
                      objectiveType: "kill"
                      questIds: [52]
                      npcIds: [483, 484]
                    onEnter:
                      - "coreActions.combat.setTargetFilter({483, 484})"
                      - "coreActions.nav.followPolicy('eastvale_outrunner_camp')"
                    transitions:
                      - event: "ObjectiveProgress"
                        guard: "event.questId == 52 and event.current >= 8"
                        target: "TurnInEastvale"
                    onExit:
                      - "coreActions.combat.clearTargetFilter()"

                  TurnInEastvale:
                    type: "atomic"
                    onEnter:
                      - "coreActions.nav.followPolicy('eastvale_to_town')"
                    transitions:
                      - event: "NavigationArrived"
                        guard: "event.policy == 'eastvale_to_town'"
                        target: "TravelToJasperlode"
                        actions:
                          - "coreActions.quest.turnInQuest(47)"
                          - "coreActions.quest.turnInQuest(52)"

              TravelToJasperlode:
                type: "atomic"
                onEnter:
                  - "coreActions.nav.followPolicy('eastvale_to_jasperlode')"
                transitions:
                  - event: "NavigationArrived"
                    guard: "event.policy == 'eastvale_to_jasperlode'"
                    target: "JasperlodeObjectives"

          JasperlodeObjectives:
            type: "compound"
            meta:
              objectiveGroup: "Jasperlode Mine"
            initial: "AcceptJasperlodeQuests"
            states:
              AcceptJasperlodeQuests:
                type: "atomic"
                onEnter:
                  - "coreActions.quest.acceptAllQuestsAtNpc(295)"  -- William Pestle
                transitions:
- event: "QuestAccepted"
            guard: "event.questId == 62 or event.questId == 76"
            target: "JasperlodeKilling"

              JasperlodeKilling:
                type: "exclusive"
                initial: "KillTunnelers"
                states:
                  KillTunnelers:
                    type: "atomic"
                    meta:
                      objectiveGroup: "Fargodeep Mine"
                      objectiveType: "kill"
                      questIds: [62]
                      npcIds: [474, 475]  -- Kobold Tunnelers
                    onEnter:
                      - "coreActions.combat.setTargetFilter({474, 475})"
                      - "coreActions.nav.followPolicy('jasperlode_fargodeep')"
                    transitions:
                      - event: "ObjectiveProgress"
                        guard: "event.questId == 62 and event.current >= 6"
                        target: "KillMiners"
                    onExit:
                      - "coreActions.combat.clearTargetFilter()"

                  KillMiners:
                    type: "atomic"
                    meta:
                      objectiveGroup: "Jasperlode Mine"
                      objectiveType: "kill"
                      questIds: [76]
                      npcIds: [476, 477]  -- Kobold Miners
                    onEnter:
                      - "coreActions.combat.setTargetFilter({476, 477})"
                      - "coreActions.nav.followPolicy('jasperlode_deep')"
                    transitions:
                      - event: "ObjectiveProgress"
                        guard: "event.questId == 76 and event.current >= 10"
                        target: "TurnInJasperlode"
                    onExit:
                      - "coreActions.combat.clearTargetFilter()"

                  TurnInJasperlode:
                    type: "atomic"
                    onEnter:
                      - "coreActions.nav.followPolicy('jasperlode_to_goldshire')"
                    transitions:
                      - event: "NavigationArrived"
                        guard: "event.policy == 'jasperlode_to_goldshire'"
                        target: "TravelToLevel10"
                        actions:
                          - "coreActions.quest.turnInQuest(62)"
                          - "coreActions.quest.turnInQuest(76)"

              TravelToLevel10:
                type: "atomic"
                onEnter:
                  - "coreActions.nav.followPolicy('goldshire_level10_grind')"
                transitions:
                  - event: "LevelUp"
                    guard: "event.newLevel >= 10"
                    target: "Finished"

      Finished:
        type: "final"
        onEnter: ["coreActions.core.log('Profile complete: Human 1-10 Elwynn')"]

  Survival:
    type: "parallel"
    initial: "HealthManagement"
    regions:
      HealthManagement:
        type: "exclusive"
        initial: "Healthy"
        states:
          Healthy:
            type: "atomic"
            transitions:
              - event: "HealthChanged"
                guard: "event.pct < 40"
                target: "Eating"
          Eating:
            type: "atomic"
            onEnter: ["coreActions.consume.useFood()"]
            transitions:
              - event: "HealthChanged"
                guard: "event.pct >= 85"
                target: "Healthy"
            onExit: ["coreActions.consume.stop()"]
      Combat:
        type: "exclusive"
        initial: "Idle"
        states:
          Idle:
            type: "atomic"
            transitions:
              - event: "CombatStart"
                target: "Fighting"
          Fighting:
            type: "atomic"
            onEnter: ["coreActions.combat.engage()"]
            transitions:
              - event: "CombatEnd"
                target: "Looting"
          Looting:
            type: "atomic"
            onEnter: ["coreActions.loot.lootAll()"]
            transitions:
              - event: "LootComplete"
                target: "Idle"
      Safety:
        type: "exclusive"
        initial: "Safe"
        states:
          Safe:
            type: "atomic"
            transitions:
              - event: "PlayerDied"
                target: "CorpseRecovery"
          CorpseRecovery:
            type: "atomic"
            onEnter:
              - "coreActions.nav.followPolicy('corpse_recovery')"
            transitions:
              - event: "NavigationArrived"
                guard: "event.policy == 'corpse_recovery'"
                target: "Safe"

  Logistics:
    type: "parallel"
    initial: "Inventory"
    regions:
      Inventory:
        type: "exclusive"
        initial: "Normal"
        states:
          Normal:
            type: "atomic"
            transitions:
              - event: "InventoryChanged"
                guard: "event.freeSlots <= 4"
                target: "Vending"
          Vending:
            type: "atomic"
            onEnter: ["coreActions.nav.followPolicy('to_nearest_vendor')"]
            transitions:
              - event: "NavigationArrived"
                target: "Selling"
              - event: "InventoryChanged"
                guard: "event.freeSlots > 10"
                target: "Normal"
          Selling:
            type: "atomic"
            onEnter: ["coreActions.vendor.sellJunk()"]
            transitions:
              - event: "VendorDone"
                target: "Normal"
      Equipment:
        type: "exclusive"
        initial: "Good"
        states:
          Good:
            type: "atomic"
            transitions:
              - event: "DurabilityChanged"
                guard: "event.pct < 30"
                target: "Repairing"
          Repairing:
            type: "atomic"
            onEnter: ["coreActions.nav.followPolicy('to_nearest_vendor')"]
            transitions:
              - event: "NavigationArrived"
                target: "RepairingVendor"
              - event: "DurabilityChanged"
                guard: "event.pct > 90"
                target: "Good"
          RepairingVendor:
            type: "atomic"
            onEnter: ["coreActions.vendor.repair()"]
            transitions:
              - event: "VendorDone"
                target: "Good"
      Travel:
        type: "exclusive"
        initial: "Walking"
        states:
          Walking:
            type: "atomic"
            transitions:
              - event: "MountAvailable"
                target: "Mounted"
          Mounted:
            type: "atomic"
            onEnter: ["coreActions.movement.mount()"]
            transitions:
              - event: "Dismount"
                target: "Walking"

actions:
  # Core actions referenced by "coreActions." prefix
  # Profile-specific composite actions
  smartTurnIn: "local questId = profile.activeQuest if not questId then return false end local reward = coreActions.engine.selectBestReward(questId, profile.playerClass) return coreActions.quest.turnInQuest(questId, reward)"