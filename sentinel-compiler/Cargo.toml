[workspace]
resolver = "2"
members = [
    "crates/sentinel-schema",
    "crates/sentinel-queryserver",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Sentinel Contributors"]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde", "fast-rng"] }
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1.0", features = ["macros", "rt-multi-thread", "signal", "net", "time", "fs", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
moka = { version = "0.12", features = ["sync"] }
dashmap = "6.0"
parking_lot = "0.12"
anyhow = "1.0"
rusqlite = { version = "0.31", features = ["bundled"] }
axum = { version = "0.7", features = ["macros"] }
tower-http = { version = "0.5", features = ["trace", "timeout"] }