[workspace]
resolver = "2"
members = ["crates/pb-core", "crates/pb-tui"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["ProfileBuddy Contributors"]

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Parsing
regex = "1.10"

# Randomization
rand = "0.8"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# TUI
ratatui = "0.28"
crossterm = "0.28"

# Logging
log = "0.4"
env_logger = "0.11"

# HTTP client for NavBuddy
reqwest = { version = "0.11", features = ["blocking", "json"] }

# Parallel processing
rayon = "1.10"

# Internal crates
pb-core = { path = "crates/pb-core" }
